#   (+ shared/models.md, shared/prompt-caching.md in the same dir). That path is extracted per
#   Claude Code release and is ephemeral; the values below are the pinned copy.
# cache_write_5m = 1.25x input, cache_write_1h = 2x input, cache_read = 0.1x input unless the
# skill states otherwise (Fable 5.1: $0.25, Opus 5.5 / Sonnet 5.5: $0.20, Fable 5: $1).
# Rows whose cache_read is the 0.1x rule rather than a quoted figure: opus-5, opus-4-*, sonnet-5,
# sonnet-4-6, haiku-5-5, haiku-4-5, fable-5.
# KNOWN UNDERSTATEMENT: claude-haiku-5-5 is $0.50 / $2.50 for prompts above 100K tokens; this
# table applies the <=100K rate to every message.
# Dated ids (claude-haiku-4-5-20251001) and a "[1m]" suffix are normalised to the base id.

