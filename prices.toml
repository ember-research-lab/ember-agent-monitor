# prices.toml — pinned Claude list prices (USD per million tokens) for `ember-agent cost`.
# List price, NOT what a subscription bills; see README "Cost accounting".
# A model id absent from this table is reported as UNPRICED, never as zero (#63).
#
# Source: claude-api skill bundled with Claude Code 2.1.305, "Current Models (cached: 2026-10-06)":
